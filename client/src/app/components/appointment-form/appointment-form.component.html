<form [formGroup]="appointmentForm" class="appointment-form">
    <mat-form-field appearance="fill">
      <mat-label>Patient Name</mat-label>
      <input matInput formControlName="patientName" placeholder="Enter full name" />
      <mat-error *ngIf="appointmentForm.get('patientName')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>
  
    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" placeholder="Enter email" />
      <mat-error *ngIf="appointmentForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="appointmentForm.get('email')?.hasError('email')">
        Enter a valid email
      </mat-error>
    </mat-form-field>
  
    <mat-form-field appearance="fill">
      <mat-label>Select Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="scheduledDate" [min]="minDate" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="appointmentForm.get('scheduledDate')?.hasError('required')">
        Date is required
      </mat-error>
    </mat-form-field>
  
    <mat-form-field appearance="fill">
      <mat-label>Select Doctor</mat-label>
      <mat-select formControlName="doctorId" (selectionChange)="onDoctorSelected($event.value, appointmentForm.get('scheduledDate')?.value)">
        <mat-option *ngFor="let doc of doctors" [value]="doc.id">{{ doc.name }}</mat-option>
      </mat-select>
      <mat-error *ngIf="appointmentForm.get('doctorId')?.hasError('required')">
        Doctor selection is required
      </mat-error>
    </mat-form-field>
  
    <mat-form-field appearance="fill">
      <mat-label>Available Time Slots</mat-label>
      <mat-select formControlName="slot">
        <mat-option *ngFor="let slot of availableSlots" [value]="slot">{{ slot }}</mat-option>
      </mat-select>
      <mat-error *ngIf="appointmentForm.get('slot')?.hasError('required')">
        Time slot is required
      </mat-error>
    </mat-form-field>
    <button mat-raised-button color="primary" class="book-appointment-button"
    (click)="submitAppointment()" 
      style="cursor: pointer; margin-top: 10px;">
      {{ isEditMode ? 'Update Appointment' : 'Book Appointment' }}
   </button>
  
  </form>
